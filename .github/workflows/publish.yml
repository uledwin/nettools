name: Build, Scan & Publish Nettools

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    # Reconstrucción semanal (Lunes,Jueves 03:00 UTC) para mantener 0 CVEs con los últimos parches de Wolfi
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Soporte multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for security scan (PR validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uledwin/nettools:scan-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (Zero-CVE Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'uledwin/nettools:scan-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: uledwin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Scout CVE check (Scout Gate)
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --
          docker scout cves local://uledwin/nettools:scan-test --only-severity critical,high,medium --exit-code

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            uledwin/nettools
            ghcr.io/uledwin/nettools
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push Multi-Arch image (Docker Hub + GHCR) with SBOM
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


      - name: Update Docker Hub Description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: uledwin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: uledwin/nettools
          short-description: Zero-CVE Wolfi Linux network troubleshooting, K8s debugging & OCI utility image (amd64/arm64).
          readme-filepath: ./README.md